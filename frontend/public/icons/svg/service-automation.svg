  <!-- Arrow between gears -->
  <path d="M32 26L36 32L32 38" stroke="url(#grad-auto)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="url(#grad-auto)"/>
  <line x1="34" y1="32" x2="36" y2="32" stroke="url(#grad-auto)" stroke-width="2"/>
