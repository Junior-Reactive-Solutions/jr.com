<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-auto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5269c3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90a0da;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Left gear -->
  <circle cx="24" cy="32" r="10" stroke="url(#grad-auto)" stroke-width="2" fill="none"/>
  <g stroke="url(#grad-auto)" stroke-width="1.5" opacity="0.7">
    <line x1="24" y1="20" x2="24" y2="16"/>
    <line x1="24" y1="48" x2="24" y2="52"/>
    <line x1="36" y1="32" x2="40" y2="32"/>
    <line x1="12" y1="32" x2="8" y2="32"/>
  </g>
  <!-- Right gear -->
  <circle cx="40" cy="32" r="10" stroke="url(#grad-auto)" stroke-width="2" fill="none"/>
